name: Build DeviceHub IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-ipa:
    name: Build DeviceHub IPA
    runs-on: macos-15
    timeout-minutes: 90

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SHARED_IOS_SUPPORT_DIR: ${{ github.workspace }}/.ci/ios-build-support
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'es.javisoto.DeviceHub' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_NAME: ${{ vars.APPLE_PROVISIONING_PROFILE_NAME || 'DeviceHub' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout shared iOS build support
        uses: actions/checkout@v4
        with:
          repository: JaviSoto/ios-build-support
          path: .ci/ios-build-support
          fetch-depth: 1

      - name: Set up Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          version: latest

      - name: Install repo toolchain
        run: mise install

      - name: Generate Xcode project
        run: mise run generate

      - name: Build the Rust protocol XCFramework
        run: ./Scripts/build-protocol-xcframework.sh

      - name: Install signing identity and provisioning profile
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/devicehub.keychain-db"
          CERT_PATH="$RUNNER_TEMP/devicehub_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/devicehub.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A

          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project DeviceHub.xcodeproj \
            -scheme DeviceHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DeviceHub.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData/DeviceHub" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            DEVICE_HUB_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVICE_HUB_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            DEVICE_HUB_CODE_SIGN_STYLE=Manual \
            DEVICE_HUB_PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_NAME"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>compileBitcode</key>
            <false/>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$APPLE_PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DeviceHub.xcarchive" \
            -exportPath "$RUNNER_TEMP/DeviceHubExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceHub-ipa
          path: ${{ runner.temp }}/DeviceHubExport/*.ipa
          if-no-files-found: error
