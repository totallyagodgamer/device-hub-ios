name: Build DeviceHub IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-ipa:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build DeviceHub IPA
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      SHARED_IOS_SUPPORT_DIR: ${{ github.workspace }}/.ci/ios-build-support
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'es.javisoto.DeviceHub' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Verify selected Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected Xcode path: $(xcode-select -p)"
          xcodebuild -version

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.15

      - name: Install repo toolchain
        run: mise install

      - name: Generate Xcode project
        run: mise run generate

      - name: Build the Rust protocol XCFramework
        run: ./Scripts/build-protocol-xcframework.sh

      - name: Archive app (unsigned)
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project DeviceHub.xcodeproj \
            -scheme DeviceHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DeviceHub.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData/DeviceHub" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Automatic

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$RUNNER_TEMP" -path '*/DeviceHub.app' -print -quit)"

          if [[ -z "$APP_PATH" ]]; then
            echo "Could not find built DeviceHub.app under $RUNNER_TEMP" >&2
            find "$RUNNER_TEMP" -maxdepth 6 -print 2>/dev/null | head -200 >&2 || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/DeviceHubExport"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/DeviceHubExport/DeviceHub-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceHub-ipa
          path: ${{ runner.temp }}/DeviceHubExport/*.ipa
          if-no-files-found: error
